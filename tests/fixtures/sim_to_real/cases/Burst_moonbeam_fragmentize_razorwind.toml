#:schema ./cases.schema.json

# Lojak, deck = MoonBeam / Fragmentize / Radiant Kaleidoscope (RazorWind).
# Radiant Kaleidoscope is a Support card with no direct proc damage here --
# expected 0 on every part. No area/seasonal/loyalty/clan damage bonuses.
# See ./README.md for the field-by-field format. expected_card_damage is
# positional, in deck order: [MoonBeam, Fragmentize, RazorWind].

[[case]]
name = "lojak_head_armor"
payload = "player_boss_sample.json"
deck = ["MoonBeam", "Fragmentize", "RazorWind"]
attackable_part = ["Head"]
expected_tap_damage = 4610
expected_card_damage = [124980, 156040, 111510]

