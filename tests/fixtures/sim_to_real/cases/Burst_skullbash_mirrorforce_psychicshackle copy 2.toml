#:schema ./cases.schema.json

# Lojak, deck = Skull Bash / Mirror Force / Psychic Shackle (LimbBurst).
# expected_card_damage is positional, in deck order:
# [SkullBash, MirrorForce, LimbBurst].
#
# TODO: expected_card_damage below is still a placeholder (0, 0, 0) --
# real numbers haven't been measured in-game for this deck yet. Fill them
# in the same way the moonbeam_fragmentize.toml cases were built. Also
# double-check expected_tap_damage: tap damage only depends on the player,
# boss, and target part (not the deck's cards), so the moonbeam_fragmentize
# values were copied over as a starting point -- but verify none of these 3
# cards modify tap damage via a passive/support effect before trusting them.

[[case]]
name = "skullbash_mirrorforce_head_armor"
payload = "player_boss_sample.json"
deck = ["SkullBash", "MirrorForce", "LimbBurst"]
attackable_part = ["Head"]
expected_tap_damage = 4610
expected_card_damage = [185470, 146200, 108540]
mirror_force_boost = 0.0

