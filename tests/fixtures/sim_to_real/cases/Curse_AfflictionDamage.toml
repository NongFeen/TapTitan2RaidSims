#:schema ./cases.schema.json

# Boss curse_type = "AfflictionDamage" with exactly 1 currently-cursed part
# (LeftLeg, same as the plain fixture) -- see
# player_boss_sample_affliction_curse.json. -6% at the default
# curse_damage_per_curse (0.06), same shape as Burst_CurseDamage.toml but
# for Affliction-type cards: applies regardless of target part state, never
# touches tap damage (card_type is None for a tap) or non-Affliction cards.
# Each baseline is reused 1:1 from its sibling Affliction_*.toml file;
# expected_card_damage is round(verified_baseline * 0.94) for the
# Affliction-type card only -- Claude's belief pending your in-game check.
#
# DecayingStrike ("DecayingAttack") is skipped here: it has no existing
# baseline anywhere in this suite, and it's a slow-ramping DoT stacker --
# a single tap only deals ~30 damage in this fixture, far too small for a
# 6% difference to mean anything against truncation/rounding noise. Needs
# its own multi-tap baseline established first, independent of curse.

# baseline (Affliction_AcidDrench.toml, "Acid Drench"): [33450, 0, 0]
[[case]]
name = "curse_affliction_acid_drench_head_armor"
payload = "player_boss_sample_affliction_curse.json"
deck = ["PoisonAttack", "TriangleSupport", "TriangleSupport"]
attackable_part = ["Head"]
expected_tap_damage = 4610
expected_card_damage = [31443, 0, 0]

