#:schema ./cases.schema.json

# Boss curse_type = "BurstDamage" with exactly 1 currently-cursed part
# (LeftLeg, same as the plain boss fixture -- curse_type is just added on
# top) -- see player_boss_sample_burst_curse.json. At the default
# curse_damage_per_curse (0.06), that's exactly -6% to every Burst-type
# card's damage (Boss::curse_damage_multiplier in boss.rs), applied
# uniformly regardless of target part state. Tap damage is never affected
# (card_type is None for a tap, so the BurstDamage match never applies), and
# non-Burst cards (Support/Affliction) in a mixed deck are untouched.
#
# Each case below reuses an EXISTING verified (non-cursed) deck/target 1:1
# from its sibling file, with expected_card_damage recomputed as
# round(original_verified_value * 0.94) for every Burst-type card in that
# deck -- NOT independently measured in-game. This is Claude's best-belief
# estimate of what the -6% curse should produce, explicitly to be
# re-verified against real gameplay (per your request) -- if a case here
# fails once you've checked the real number, that's the discrepancy to
# chase, not necessarily a code bug.
#
# One exception: ChainOfVengeance ("ChainLightning") has no existing
# baseline anywhere in this suite at all (real or otherwise), so even its
# *uncursed* starting point (148702, Head/Armor, tap 1) is only the sim's
# own prediction, not a real measurement -- flagged again on that case.

# --- MoonBeam / Fragmentize / RazorWind (all Burst) ---
# baseline (Burst_moonbeam_fragmentize_razorwind.toml, lojak_head_armor):
# [124980, 156040, 111510]
[[case]]
name = "burst_curse_moonbeam_fragmentize_razorwind_head_armor"
payload = "player_boss_sample_burst_curse.json"
deck = ["MoonBeam", "Fragmentize", "RazorWind"]
attackable_part = ["Head"]
expected_tap_damage = 4610
expected_card_damage = [117480, 146670, 10482]

