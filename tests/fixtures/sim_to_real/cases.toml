# Sim-to-real golden test cases.
#
# Each [[case]] runs one deterministic attack -- exactly one tap, guaranteed
# to proc every card with a nonzero proc chance, then the rest of a 600-tick
# round plays out with no further taps (so affliction/DoT cards finish
# ticking) -- and compares the result, component by component, to damage
# numbers measured by hand in real TapTitan2. See
# SimService::run_deterministic_single_tap_simulation for the mechanism.
#
# Fields:
#   name                 Short, unique label for this case (shown on failure).
#   payload              Path (relative to this file) to a fixture shaped
#                        `{ "player_raw_data": <raw TT2 player export>,
#                        "boss_data": <Boss JSON snapshot>, "title": <f32> }`
#                        -- player_raw_data is the same raw export shape the
#                        app normally runs through `clean_data` on import,
#                        boss_data is a direct `Boss` struct for boss state
#                        (part HP/armor/curse at the moment of the attack),
#                        and title is `PlayerRaidData::title` (an additive
#                        bonus to all raid damage, see damage_cache.rs's
#                        `raid_all_mult`) -- it's supplied separately because
#                        it isn't part of the raw export `clean_data` reads,
#                        and defaults to 0.0 if omitted. One payload file can
#                        be reused across many deck variants below.
#   deck                 Exactly 3 card ids, all present (and thus enabled)
#                        in the payload's raidCards. NOTE: a card's id here
#                        is its *serialized* id, which is not always its
#                        display name -- e.g. "Radiant Kaleidoscope" is
#                        "TriangleSupport". Check `CardName`'s
#                        `#[serde(rename = ...)]` in models/cards.rs if
#                        unsure.
#   attackable_part      Which part was targeted for this attack. Keep it to
#                        exactly the one real target -- with more than one
#                        attackable part, different attack patterns could
#                        pick different targets on the first tap.
#   expected_tap_damage  Real damage measured in-game from the player's own
#                        tap alone, excluding every card's contribution.
#   expected_card_damage Real per-card damage measured in-game, keyed by
#                        serialized card id (see `deck` note above). A card
#                        with no measurable contribution (e.g. a Support
#                        card, or one that just can't proc here) should still
#                        be listed, with 0.
#   mirror_force_boost   Optional, default 0.0. Fractional clan boost (0.35 =
#                        Mirror Force deals 35% more).
#
# No tolerance_percent field: TT2 only ever shows damage to 2 decimals of a
# K/M/B/T-shortened number, so every expected value here is already lossy
# and comparing raw digits below that precision would just be noise. The
# test itself rounds both the simulated and expected numbers to that same
# 2-decimal display precision before comparing, instead of a percentage
# fuzz band -- see round_to_display_precision in sim_to_real_tests.rs.
#
# ---------------------------------------------------------------------------
# Lojak, deck = MoonBeam / Fragmentize / Radiant Kaleidoscope (TriangleSupport)
# Radiant Kaleidoscope is a Support card with no direct proc damage here --
# expected 0 on every part. No area/seasonal/loyalty/clan damage bonuses.

[[case]]
name = "lojak_head_armor"
payload = "player_boss_sample.json"
deck = ["MoonBeam", "Fragmentize", "TriangleSupport"]
attackable_part = ["Head"]
expected_tap_damage = 4610
expected_card_damage = { MoonBeam = 124980, Fragmentize = 156040, TriangleSupport = 0 }

[[case]]
name = "lojak_torso_armor"
payload = "player_boss_sample.json"
deck = ["MoonBeam", "Fragmentize", "TriangleSupport"]
attackable_part = ["Torso"]
expected_tap_damage = 4509
expected_card_damage = { MoonBeam = 183330, Fragmentize = 152590, TriangleSupport = 0 }

[[case]]
name = "lojak_left_hand_armor"
payload = "player_boss_sample.json"
deck = ["MoonBeam", "Fragmentize", "TriangleSupport"]
attackable_part = ["LeftHand"]
expected_tap_damage = 4315
expected_card_damage = { MoonBeam = 175480, Fragmentize = 146050, TriangleSupport = 0 }

[[case]]
name = "lojak_left_leg_cursed"
payload = "player_boss_sample.json"
deck = ["MoonBeam", "Fragmentize", "TriangleSupport"]
