services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: feen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d feen"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - feen-postgres:/var/lib/postgresql/data

volumes:
  feen-postgres:
