name: Build and push images

# Runs on every push to master (the deploy branch -- see git history, both
# `dev` and `seperate-services`/`resolveasset` are already merged into it).
# Builds the API image (Dockerfile) and the sim worker image
# (Dockerfile.worker) and pushes both to GHCR. Coolify's docker-compose
# deploy (docker-compose.coolify.yml) pulls these by tag rather than
# building from source itself.
#
# Built for linux/arm64 specifically (via QEMU on this amd64 runner), not
# amd64 -- that's the actual architecture of the Coolify server this gets
# deployed to. If you ever add an x86 deploy target too, add linux/amd64
# back to the `platforms:` lists below (comma-separated) for a multi-arch
# manifest -- just note the arm64 leg will still build under slow QEMU
# emulation either way, Rust release builds are not fast to emulate.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest runners are amd64; this registers QEMU so buildx can
      # cross-compile for arm64 (your Coolify server's actual architecture)
      # on that same amd64 runner.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires a lowercase image name even though the GitHub
      # owner/repo casing isn't.
      - id: owner
        run: echo "lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/feen-backend:latest
            ghcr.io/${{ steps.owner.outputs.lower }}/feen-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.worker
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/feen-worker:latest
            ghcr.io/${{ steps.owner.outputs.lower }}/feen-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
